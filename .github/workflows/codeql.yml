name: CodeQL Analysis

on: 
  push:
  pull_request: 

jobs: 
  analyze:
    runs-on: ubuntu-latest
    permissions: 
      security-events: write
    steps: 
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create dummy appsettings.json
        run: |
          echo '{"ConnectionString":"Server=localhost;Port=3306;Database=player_one;User=root;Password=dummy;"}' > appsettings.json
          
      - uses: github/codeql-action/init@v4
        with: 
          languages: csharp
          build-mode: manual
          
      - name: Build
        run: dotnet build --no-incremental
        
      - uses: github/codeql-action/analyze@v4